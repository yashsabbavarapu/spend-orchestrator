[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spend-orchestrator"
version = "0.1.0"
description = "Guardrailed budget allocator: every dollar it moves carries its reason in plain language"
requires-python = ">=3.11"

[project.scripts]
spend-orchestrator = "spend_orchestrator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
